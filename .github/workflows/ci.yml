name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

  builder-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Full ADR 0010 chain against a scratch PGlite store: spec approval →
      # blueprint → provenance apply_skill → verify gate → gated registration,
      # asserting blueprint_hash + verify_report_ref land on the system.
      - name: Builder Runtime end-to-end smoke
        run: pnpm smoke:builder
        env:
          DAM_PG_DATA_DIR: ${{ runner.temp }}/dam-smoke

  readme-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for unresolved placeholders
        run: |
          if grep -n '<your-org>' README.md; then
            echo "::error::Found unresolved <your-org> placeholder in README.md"
            exit 1
          fi
      - name: Check for empty GitHub links
        run: |
          if grep -nE '\]\(https://github\.com/?\)' README.md; then
            echo "::error::Found empty https://github.com/ links in README.md"
            exit 1
          fi
