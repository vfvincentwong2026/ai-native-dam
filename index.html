<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI-Native DAM</title>
  <meta name="description" content="The governance plane for AI-native assets, skills, generated systems, and distilled capabilities.">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.6.1/github-markdown.min.css">
  <style>
    body { box-sizing: border-box; max-width: 980px; margin: 0 auto; padding: 45px; }
    @media (max-width: 767px) { body { padding: 15px; } }
    #content { min-height: 200px; }
    .loading { color: #888; font-family: monospace; }
  </style>
</head>
<body class="markdown-body">
  <div id="content" class="loading">Loading README...</div>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    fetch('/README.md')
      .then(function (r) {
        if (!r.ok) throw new Error('README not found');
        return r.text();
      })
      .then(function (t) {
        document.getElementById('content').className = '';
        document.getElementById('content').innerHTML = marked.parse(t);
      })
      .catch(function (e) {
        document.getElementById('content').textContent = 'Failed to load README: ' + e.message;
      });
  </script>
</body>
</html>
